# Standalone package (kept out of the parent /Users/stast/Learning workspace)
[workspace]

[package]
name = "rust_test"
version = "0.1.0"
edition = "2024"

[dependencies]
change-case = "0.2.0"
rand = "0.8"
anyhow = "1.0.98"

[dev-dependencies]
criterion = "0.5"

# ---------------------------------------------------------------------------
# Benchmarks (run with `cargo bench`). `harness = false` because Criterion
# provides its own main().
# ---------------------------------------------------------------------------
[[bench]]
name = "sorting"
harness = false

[[bench]]
name = "bank"
harness = false

[lints.rust]
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"
unused = "allow"
unused_mut = "allow"
irrefutable_let_patterns = "allow"

# ---------------------------------------------------------------------------
# Examples — every learning file. Run any of them with:
#     cargo run --example <name>
# e.g. `cargo run --example s05_enums`
# ---------------------------------------------------------------------------

