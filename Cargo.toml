# Standalone package (kept out of the parent /Users/stast/Learning workspace)
[workspace]

[package]
name = "rust_test"
version = "0.1.0"
edition = "2024"

[dependencies]
change-case = "0.2.0"
rand = "0.8"
anyhow = "1.0.98"
thiserror = "2.0.12"
log = "0.4"
env_logger = "0.11.8"
tokio = {version = "1.46.1", features = ["full"]}
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[dev-dependencies]
criterion = "0.5"

# ---------------------------------------------------------------------------
# Benchmarks (run with `cargo bench`). `harness = false` because Criterion
# provides its own main().
# ---------------------------------------------------------------------------
[[bench]]
name = "sorting"
harness = false

[[bench]]
name = "bank"
harness = false

[lints.rust]
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"
unused = "allow"
unused_mut = "allow"
irrefutable_let_patterns = "allow"

# ---------------------------------------------------------------------------
# Examples are auto-discovered: any file placed directly in examples/ becomes
# runnable with no changes here. Just create examples/<name>.rs (with a
# `fn main`) and run it:
#     cargo run --example <name>      # <name> = filename without .rs
# Naming convention: sNN_* = section NN, pNN_* = practition NN, practice_* = drills.
# NOTE: nested folders (examples/foo/bar.rs) are NOT auto-discovered — keep files flat.
# ---------------------------------------------------------------------------
